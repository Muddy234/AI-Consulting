{% extends "base.html" %}

{% block title %}Quick Email - AI Agent{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-envelope me-2"></i>Send Email
            </div>
            <div class="card-body">
                <form action="{{ url_for('quick_email') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label">To</label>
                        <input type="email" name="to" class="form-control"
                               placeholder="recipient@example.com" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Subject</label>
                        <input type="text" name="subject" class="form-control"
                               placeholder="Email subject" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Message Body</label>
                        <textarea name="body" class="form-control" rows="8"
                                  placeholder="Type your email message here..." required></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Priority</label>
                                <select name="priority" class="form-select">
                                    <option value="1">Normal</option>
                                    <option value="2">High</option>
                                    <option value="3">Urgent</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-send me-1"></i>Add to Queue
                        </button>
                        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i>Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
