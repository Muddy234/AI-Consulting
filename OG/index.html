<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Ember Crown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --page-bg: #ebe0c2;
  --ink: #2a1810;
  --ink-dim: #5a3a25;
  --ink-heading: #1a0c06;
  --ember-glow: #a8451a;
  --ember-bright: #c95a1f;
  --ember-deep: #6b2818;
  --blood: #8b2e1f;
  --hud-bg: #060a14;
  --hud-border: #2a3447;
  --hud-text: #c4d4ee;
  --hud-bright: #e8eef9;
  --hud-accent: #7fc8e0;
  --hud-warn: #e8c479;
  --hud-danger: #e8916d;
  --link-color: #6b2818;
  --link-bg-hover: #f3e9c9;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--page-bg); }
body {
  color: var(--ink);
  font-family: 'Spectral', Georgia, serif;
  font-size: 18px;
  line-height: 1.65;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse at top, rgba(168, 69, 26, 0.04), transparent 60%),
    radial-gradient(ellipse at bottom, rgba(107, 40, 24, 0.04), transparent 60%);
  pointer-events: none; z-index: 0;
}

/* ---------- layout ---------- */
.app {
  position: relative; z-index: 1;
  max-width: 980px;
  margin: 0 auto;
  padding: 36px 28px 80px;
  display: grid;
  grid-template-columns: 1fr;
  gap: 28px;
}
.title-row {
  display: flex; align-items: baseline; justify-content: space-between;
  border-bottom: 1px solid rgba(42, 24, 16, 0.2);
  padding-bottom: 14px;
}
.title-row h1 {
  font-family: 'Cinzel', serif;
  font-weight: 600;
  font-size: 28px;
  color: var(--ink-heading);
  letter-spacing: 0.04em;
}
.title-row .subtitle {
  font-style: italic;
  color: var(--ink-dim);
  font-size: 14px;
}

/* ---------- HUD ---------- */
.hud {
  background: var(--hud-bg);
  color: var(--hud-text);
  border: 1px solid var(--hud-border);
  border-radius: 4px;
  padding: 14px 20px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 28px;
  flex-wrap: wrap;
}
.hud-clock {
  display: flex; flex-direction: column; gap: 2px; min-width: 110px;
}
.hud-label {
  font-size: 10px; color: var(--hud-text); opacity: 0.6;
  text-transform: uppercase; letter-spacing: 0.1em;
}
.hud-clock-value {
  font-family: 'Cinzel', serif;
  font-size: 22px;
  font-weight: 600;
  color: var(--hud-bright);
}
.hud-clock-value.warn   { color: var(--hud-warn); }
.hud-clock-value.danger { color: var(--hud-danger); }
.hud-clock-value.qual   { font-style: italic; font-size: 16px; font-weight: 500; }

.hud-condition .chip {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 99px;
  background: rgba(127, 200, 224, 0.12);
  border: 1px solid var(--hud-accent);
  color: var(--hud-bright);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: capitalize;
}
.hud-condition .chip.wounded   { background: rgba(232, 145, 109, 0.15); border-color: var(--hud-danger); color: var(--hud-danger); }
.hud-condition .chip.exhausted { background: rgba(232, 196, 121, 0.15); border-color: var(--hud-warn); color: var(--hud-warn); }
.hud-condition .chip.dying     { background: rgba(232, 145, 109, 0.25); border-color: var(--hud-danger); color: #ffd8c8; }

.hud-threats { display: flex; gap: 10px; flex-wrap: wrap; }
.threat-chip {
  display: flex; flex-direction: column; gap: 2px;
  padding: 4px 12px;
  border-radius: 4px;
  background: rgba(168, 69, 26, 0.18);
  border: 1px solid var(--ember-glow);
  font-size: 11px;
}
.threat-chip .name { color: var(--hud-bright); font-weight: 600; letter-spacing: 0.04em; }
.threat-chip .phase { color: #ffb892; font-style: italic; }
.threat-chip.imminent { background: rgba(139, 46, 31, 0.4); border-color: var(--hud-danger); }

.hud-actions { margin-left: auto; }
.hud-actions button {
  background: transparent;
  border: 1px solid var(--hud-border);
  color: var(--hud-text);
  padding: 4px 12px;
  font-family: inherit; font-size: 11px;
  border-radius: 3px;
  cursor: pointer;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.hud-actions button:hover { background: rgba(196, 212, 238, 0.06); color: var(--hud-bright); }

/* ---------- prose ---------- */
.prose-area {
  display: flex; flex-direction: column; gap: 24px;
}
.prose-block {
  font-size: 18px;
  line-height: 1.7;
  color: var(--ink);
}
.prose-block p { margin-bottom: 16px; }
.prose-block .resolution-label {
  font-family: 'Cinzel', serif;
  text-transform: uppercase; letter-spacing: 0.15em;
  font-size: 11px; color: var(--ember-deep);
  margin-bottom: 6px;
}
.prose-divider {
  height: 1px; background: rgba(42, 24, 16, 0.15);
  margin: 8px 0;
}
.beat-title {
  font-family: 'Cinzel', serif;
  font-weight: 600;
  font-size: 19px;
  color: var(--ember-deep);
  letter-spacing: 0.04em;
  margin-bottom: 12px;
}

/* hyperlinks: italic + bold typographically distinct (per Phase F/G design) */
.prose-block a.hyperlink {
  font-style: italic;
  font-weight: 700;
  color: var(--link-color);
  text-decoration: none;
  cursor: pointer;
  border-bottom: 1px dotted rgba(107, 40, 24, 0.4);
  padding: 0 1px;
  transition: background 0.12s;
}
.prose-block a.hyperlink:hover { background: var(--link-bg-hover); }
.prose-block a.hyperlink.read {
  color: var(--ink-dim);
  border-bottom-style: dotted;
  font-weight: 500;
}

/* ---------- choices ---------- */
.choices { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
.choice-button {
  background: transparent;
  border: 1px solid rgba(42, 24, 16, 0.25);
  border-left: 3px solid var(--ember-glow);
  font-family: 'Spectral', serif;
  font-size: 16px;
  color: var(--ink);
  padding: 14px 20px;
  text-align: left;
  cursor: pointer;
  transition: all 0.15s;
  border-radius: 2px;
}
.choice-button:hover {
  background: var(--link-bg-hover);
  border-left-color: var(--ember-bright);
}
.choice-button .label {
  font-family: 'Cinzel', serif;
  font-weight: 600;
  margin-right: 12px;
  color: var(--ember-deep);
}
.choice-button:disabled { opacity: 0.5; cursor: wait; }

/* ---------- terminal screen ---------- */
.terminal {
  text-align: center;
  padding: 28px 20px;
  background: rgba(107, 40, 24, 0.06);
  border: 1px solid rgba(107, 40, 24, 0.25);
  border-radius: 4px;
}
.terminal h2 {
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 22px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ember-deep);
  margin-bottom: 16px;
}
.terminal-summary { font-style: italic; font-size: 17px; line-height: 1.7; }
.terminal-actions { margin-top: 24px; }
.terminal-actions button {
  font-family: 'Cinzel', serif; font-weight: 600;
  background: var(--ember-deep); color: #f4ead0;
  padding: 10px 28px; font-size: 13px;
  letter-spacing: 0.1em; text-transform: uppercase;
  border: none; border-radius: 2px; cursor: pointer;
}
.terminal-actions button:hover { background: var(--ember-bright); }

/* ---------- link popup (overlay) ---------- */
.popup-bg {
  position: fixed; inset: 0;
  background: rgba(26, 12, 6, 0.55);
  display: flex; align-items: center; justify-content: center;
  z-index: 50; padding: 24px;
}
.popup {
  background: var(--page-bg);
  border: 1px solid rgba(42, 24, 16, 0.4);
  border-radius: 4px;
  max-width: 480px;
  width: 100%;
  padding: 22px 26px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
}
.popup-title {
  font-family: 'Cinzel', serif;
  font-weight: 600;
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ember-deep);
  margin-bottom: 12px;
}
.popup-body { font-size: 16px; line-height: 1.65; }
.popup-cost {
  margin-top: 14px; padding: 10px 14px;
  background: rgba(168, 69, 26, 0.1);
  border-left: 2px solid var(--ember-glow);
  font-size: 13px;
  font-style: italic;
}
.popup-actions {
  display: flex; gap: 10px; justify-content: flex-end;
  margin-top: 18px;
}
.popup-actions button {
  font-family: 'Cinzel', serif; font-size: 11px;
  letter-spacing: 0.08em; text-transform: uppercase;
  padding: 6px 16px;
  border-radius: 2px; cursor: pointer;
  border: 1px solid var(--ink-dim);
  background: transparent;
  color: var(--ink);
}
.popup-actions button.primary {
  background: var(--ember-deep); border-color: var(--ember-deep); color: #f4ead0;
}
.popup-actions button.primary:hover { background: var(--ember-bright); }
.popup-actions button:hover { background: var(--link-bg-hover); }

/* ---------- status / error ---------- */
.status {
  padding: 12px 16px;
  background: rgba(232, 196, 121, 0.15);
  border-left: 3px solid var(--hud-warn);
  font-size: 14px; font-style: italic;
  border-radius: 2px;
}
.status.error { background: rgba(232, 145, 109, 0.15); border-color: var(--hud-danger); }

.empty { color: var(--ink-dim); font-style: italic; }
</style>
</head>
<body>
<div class="app">
  <div class="title-row">
    <h1>The Ember Crown</h1>
    <span class="subtitle">A king dies. An era ends.</span>
  </div>

  <div id="hud" class="hud" hidden></div>

  <div id="main" class="prose-area"></div>

  <div id="status" class="status" hidden></div>
</div>

<script>
const SERVER = 'http://127.0.0.1:3000';
const STORAGE_KEY = 'ember-crown-game-id';

// ---------- API ----------

async function api(path, init) {
  const res = await fetch(SERVER + path, {
    ...init,
    headers: { 'Content-Type': 'application/json', ...(init?.headers ?? {}) }
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || `HTTP ${res.status}`);
    err.detail = data;
    throw err;
  }
  return data;
}

// ---------- state ----------

const game = {
  gameId: null,
  beatNumber: 1,
  isOpening: true,
  currentProse: null,
  currentLinkContents: {},
  currentChoices: [],
  resolutionProse: null,
  resolutionLinkContents: {},
  beatTitle: null,
  publicState: null,
  terminalState: null,
  isEnding: false,
  openedLinks: new Set()
};

function persistGameId(id) {
  if (id) localStorage.setItem(STORAGE_KEY, id);
  else    localStorage.removeItem(STORAGE_KEY);
}
function loadGameId() { return localStorage.getItem(STORAGE_KEY); }
function newGameId()  { return 'ember-' + Math.random().toString(36).slice(2, 9); }

// ---------- /turn ----------

async function startOrContinue() {
  let gameId = loadGameId();
  if (!gameId) {
    gameId = newGameId();
    persistGameId(gameId);
  }
  game.gameId = gameId;
  setStatus(null);
  await postTurn(null);
}

async function postTurn(choice) {
  setBusy(true);
  setStatus(choice ? 'Sending choice...' : 'Loading the world...');
  try {
    const body = { gameId: game.gameId };
    if (choice) body.choice = choice;
    const data = await api('/turn', { method: 'POST', body: JSON.stringify(body) });
    handleTurnResponse(data);
    setStatus(null);
  } catch (err) {
    if (String(err.message).includes('missing_choice_label')) {
      // Existing game with no choice supplied — start fresh.
      console.warn('Existing game on server but no choice provided; resetting.');
      try { await api('/reset', { method: 'POST', body: JSON.stringify({ gameId: game.gameId }) }); } catch {}
      await postTurn(null);
      return;
    }
    setStatus('Cannot reach local server: ' + err.message, true);
  } finally {
    setBusy(false);
  }
}

function handleTurnResponse(data) {
  game.beatNumber = data.beatNumber ?? game.beatNumber;
  game.publicState = data.publicState ?? game.publicState;
  game.isOpening = Boolean(data.isOpening);
  game.isEnding = Boolean(data.isEnding);
  game.terminalState = data.terminalState ?? null;
  game.openedLinks = new Set();

  if (data.isOpening) {
    game.currentProse = data.prose ?? { segments: [] };
    game.currentLinkContents = data.linkContents ?? {};
    game.currentChoices = data.choices ?? [];
    game.resolutionProse = null;
    game.resolutionLinkContents = {};
    game.beatTitle = null;
  } else {
    game.resolutionProse = data.resolutionProse ?? null;
    game.resolutionLinkContents = data.resolutionLinkContents ?? {};
    if (data.nextBeat) {
      game.currentProse = data.nextBeat.intro ?? { segments: [] };
      game.currentLinkContents = data.nextBeat.introLinkContents ?? {};
      game.currentChoices = data.nextBeat.choices ?? [];
      game.beatTitle = data.nextBeat.title ?? null;
    } else {
      game.currentProse = null;
      game.currentLinkContents = {};
      game.currentChoices = [];
      game.beatTitle = null;
    }
  }
  render();
}

// ---------- /investigate ----------

async function postInvestigate(linkId) {
  setBusy(true);
  setStatus('Investigating...');
  try {
    const data = await api('/investigate', {
      method: 'POST',
      body: JSON.stringify({
        gameId: game.gameId,
        beatNumber: game.beatNumber,
        linkId
      })
    });
    if (data.publicState) game.publicState = data.publicState;
    game.openedLinks.add(linkId);
    setStatus(null);
    return data;
  } catch (err) {
    setStatus('Investigation failed: ' + err.message, true);
    return null;
  } finally {
    setBusy(false);
  }
}

// ---------- /reset ----------

async function reset() {
  if (game.gameId) {
    try { await api('/reset', { method: 'POST', body: JSON.stringify({ gameId: game.gameId }) }); } catch {}
  }
  persistGameId(null);
  Object.assign(game, {
    gameId: null, beatNumber: 1, isOpening: true,
    currentProse: null, currentLinkContents: {}, currentChoices: [],
    resolutionProse: null, resolutionLinkContents: {}, beatTitle: null,
    publicState: null, terminalState: null, isEnding: false,
    openedLinks: new Set()
  });
  await startOrContinue();
}

// ---------- rendering helpers ----------

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'className')      node.className = v;
    else if (k === 'onclick')   node.addEventListener('click', v);
    else if (k === 'dataset')   Object.assign(node.dataset, v);
    else if (k === 'style')     node.setAttribute('style', v);
    else if (k === 'hidden')    { if (v) node.hidden = true; }
    else                        node.setAttribute(k, v);
  }
  for (const c of children) {
    if (c == null) continue;
    if (typeof c === 'string') node.appendChild(document.createTextNode(c));
    else                       node.appendChild(c);
  }
  return node;
}

function setStatus(text, isError = false) {
  const s = document.getElementById('status');
  if (!text) { s.hidden = true; s.textContent = ''; return; }
  s.hidden = false;
  s.textContent = text;
  s.className = 'status' + (isError ? ' error' : '');
}

function setBusy(b) {
  document.body.style.cursor = b ? 'progress' : '';
  for (const btn of document.querySelectorAll('.choice-button')) btn.disabled = b;
}

function render() {
  renderHud();
  renderMain();
}

function qualitativeClock(h) {
  if (h <= 0) return 'time has run out';
  if (h <= 3) return 'a handful of hours';
  if (h <= 6) return 'a single day, perhaps';
  return 'less than half a day';
}

function renderHud() {
  const hud = document.getElementById('hud');
  hud.replaceChildren();
  const ps = game.publicState;
  if (!ps) { hud.hidden = true; return; }
  hud.hidden = false;

  // clock
  const ch = ps.clockHours ?? 0;
  let clockEl;
  if (ch < 12) {
    clockEl = el('span', { className: 'hud-clock-value qual danger' }, qualitativeClock(ch));
  } else if (ch < 36) {
    clockEl = el('span', { className: 'hud-clock-value warn' }, ch + 'h');
  } else {
    clockEl = el('span', { className: 'hud-clock-value' }, ch + 'h');
  }
  hud.appendChild(el('div', { className: 'hud-clock' },
    el('span', { className: 'hud-label' }, 'Hours remaining'),
    clockEl
  ));

  // condition
  if (ps.condition) {
    hud.appendChild(el('div', { className: 'hud-condition' },
      el('span', { className: 'hud-label' }, 'You are '),
      el('span', { className: 'chip ' + ps.condition }, ps.condition)
    ));
  }

  // known threats — only those visible in HUD; cap 2; rest collapse
  const visible = (ps.knownThreats || []).filter(t => t.isVisibleInHud);
  if (visible.length > 0) {
    const threats = el('div', { className: 'hud-threats' });
    const shown = visible.slice(0, 2);
    for (const t of shown) {
      const phase = (t.currentPhase || '').toLowerCase();
      const cls = 'threat-chip' + (phase === 'imminent' ? ' imminent' : '');
      threats.appendChild(el('div', { className: cls },
        el('span', { className: 'name' }, t.displayName),
        el('span', { className: 'phase' }, t.currentPhase || '')
      ));
    }
    if (visible.length > 2) {
      threats.appendChild(el('div', {
        className: 'threat-chip',
        title: visible.slice(2).map(t => t.displayName).join(', ')
      },
        el('span', { className: 'name' }, '...'),
        el('span', { className: 'phase' }, '+' + (visible.length - 2) + ' more')
      ));
    }
    hud.appendChild(threats);
  }

  hud.appendChild(el('div', { className: 'hud-actions' },
    el('button', {
      onclick: () => { if (confirm('Begin again? Your run will be lost.')) reset(); }
    }, 'Reset')
  ));
}

function renderMain() {
  const main = document.getElementById('main');
  main.replaceChildren();

  if (game.isEnding && game.terminalState) {
    main.appendChild(renderTerminal());
    return;
  }

  // Resolution prose (if any) — what just happened from the player's last choice
  if (game.resolutionProse) {
    const block = el('div', { className: 'prose-block' });
    block.appendChild(el('div', { className: 'resolution-label' }, '— Resolution —'));
    block.appendChild(renderSegments(game.resolutionProse, game.resolutionLinkContents));
    main.appendChild(block);
    main.appendChild(el('div', { className: 'prose-divider' }));
  }

  // Beat title (intro)
  if (game.beatTitle) {
    main.appendChild(el('div', { className: 'beat-title' }, game.beatTitle));
  }

  // Current beat prose (intro of next beat, or opening prose)
  if (game.currentProse) {
    const block = el('div', { className: 'prose-block' });
    block.appendChild(renderSegments(game.currentProse, game.currentLinkContents));
    main.appendChild(block);
  }

  // Choices
  if (game.currentChoices && game.currentChoices.length > 0) {
    const choices = el('div', { className: 'choices' });
    for (const c of game.currentChoices) {
      choices.appendChild(el('button', {
        className: 'choice-button',
        onclick: () => postTurn(c.label)
      },
        el('span', { className: 'label' }, c.label),
        c.text
      ));
    }
    main.appendChild(choices);
  }
}

function renderSegments(prose, linkContents) {
  const wrap = el('div');
  let currentP = el('p');
  for (const seg of (prose?.segments || [])) {
    if (seg.type === 'text') {
      const parts = (seg.content || '').split(/\n\n+/);
      for (let i = 0; i < parts.length; i++) {
        if (i > 0) {
          wrap.appendChild(currentP);
          currentP = el('p');
        }
        if (parts[i]) currentP.appendChild(document.createTextNode(parts[i]));
      }
    } else if (seg.type === 'link') {
      const id = seg.id;
      const a = el('a', {
        className: 'hyperlink' + (game.openedLinks.has(id) ? ' read' : ''),
        href: 'javascript:void(0)',
        dataset: { linkId: id }
      }, seg.content || '');
      a.addEventListener('click', (ev) => {
        ev.preventDefault();
        showLinkPopup(id, linkContents);
      });
      currentP.appendChild(a);
    }
  }
  wrap.appendChild(currentP);
  return wrap;
}

function renderTerminal() {
  const ts = game.terminalState;
  const wrap = el('div', { className: 'terminal' });
  wrap.appendChild(el('h2', {}, terminalTitle(ts.kind)));
  if (game.resolutionProse) {
    const block = el('div', {
      className: 'prose-block',
      style: 'text-align: left; max-width: 580px; margin: 0 auto;'
    });
    block.appendChild(renderSegments(game.resolutionProse, game.resolutionLinkContents));
    wrap.appendChild(block);
  }
  if (ts.summary) {
    wrap.appendChild(el('p', {
      className: 'terminal-summary',
      style: 'margin-top: 14px;'
    }, ts.summary));
  }
  wrap.appendChild(el('div', { className: 'terminal-actions' },
    el('button', { onclick: reset }, 'Begin Again')
  ));
  return wrap;
}

function terminalTitle(kind) {
  switch (kind) {
    case 'reached-king': return 'You Reach the King';
    case 'time-up':      return 'The Bells Toll';
    case 'killed':       return 'You Fall';
    case 'trapped':      return 'You Are Taken';
    case 'jailed':       return 'You Are Caged';
    default:             return 'The Era Ends';
  }
}

// ---------- link popup ----------

let popupOpen = false;
let escListener = null;

function showLinkPopup(linkId, linkContents) {
  if (popupOpen) return;
  const link = (linkContents || {})[linkId];
  if (!link) {
    console.warn('No linkContents entry for', linkId);
    return;
  }

  const alreadyOpened = game.openedLinks.has(linkId);
  const cost = Number(link.costHours) || 0;

  if (cost > 0 && !alreadyOpened) {
    showCostConfirm(linkId, link);
    return;
  }
  // Free link OR already opened: show content, fire-and-forget /investigate on first click
  if (!alreadyOpened) postInvestigate(linkId);
  showPopupContent(link.content);
}

function showCostConfirm(linkId, link) {
  popupOpen = true;
  const cost = Number(link.costHours) || 0;
  const bg = el('div', { className: 'popup-bg' });
  const popup = el('div', { className: 'popup' });
  popup.appendChild(el('div', { className: 'popup-title' }, 'Investigate?'));
  popup.appendChild(el('div', { className: 'popup-body' },
    el('p', {}, 'This will take time you may not have to spare.')
  ));
  popup.appendChild(el('div', { className: 'popup-cost' },
    'Cost: about ' + cost + ' hour' + (cost === 1 ? '' : 's') + '.'
  ));
  popup.appendChild(el('div', { className: 'popup-actions' },
    el('button', { onclick: () => closePopup(bg) }, 'Step away'),
    el('button', { className: 'primary', onclick: async () => {
      closePopup(bg);
      const data = await postInvestigate(linkId);
      if (data && data.ok) showPopupContent(link.content);
    } }, 'Look closer')
  ));
  bg.appendChild(popup);
  bg.addEventListener('click', (ev) => { if (ev.target === bg) closePopup(bg); });
  attachEsc(bg);
  document.body.appendChild(bg);
}

function showPopupContent(content) {
  popupOpen = true;
  const bg = el('div', { className: 'popup-bg' });
  const popup = el('div', { className: 'popup' });
  popup.appendChild(el('div', { className: 'popup-title' }, 'In the margin'));
  popup.appendChild(el('div', { className: 'popup-body' },
    el('p', {}, content)
  ));
  popup.appendChild(el('div', { className: 'popup-actions' },
    el('button', { className: 'primary', onclick: () => closePopup(bg) }, 'Close')
  ));
  bg.appendChild(popup);
  bg.addEventListener('click', (ev) => { if (ev.target === bg) closePopup(bg); });
  attachEsc(bg);
  document.body.appendChild(bg);
  // Re-render so the link picks up its "read" styling
  render();
}

function attachEsc(bg) {
  if (escListener) document.removeEventListener('keydown', escListener);
  escListener = (e) => { if (e.key === 'Escape') closePopup(bg); };
  document.addEventListener('keydown', escListener);
}

function closePopup(bg) {
  popupOpen = false;
  if (escListener) { document.removeEventListener('keydown', escListener); escListener = null; }
  if (bg && bg.parentNode) bg.parentNode.removeChild(bg);
}

// ---------- boot ----------

window.addEventListener('DOMContentLoaded', () => {
  startOrContinue().catch(err => {
    setStatus('Failed to start: ' + err.message, true);
  });
});
</script>
</body>
</html>
